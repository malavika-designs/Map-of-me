<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map of Me</title>
  <meta name="description" content="An index of mind: the things I make, consume, live by and love, all threaded back to one head.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" class="stage">
    <img id="me" class="me" alt="Me, sitting on the kitchen floor holding two tomatoes over my eyes" draggable="false">
    <svg id="threads" class="threads" aria-hidden="true"></svg>
    <div id="nodes" class="nodes"></div>
    <p class="hint">pull a thread · click a card</p>
  </main>

  <div id="paper" class="paper" hidden><div class="paper-sheet"></div></div>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <figure class="viewer-card"><img id="viewer-img" alt=""></figure>
    <div class="viewer-text">
      <p class="viewer-bucket" id="viewer-bucket"></p>
      <h2 class="viewer-title" id="viewer-title"></h2>
      <p class="viewer-label">why it’s in my index</p>
      <p class="viewer-why" id="viewer-why"></p>
    </div>
    <button class="viewer-close" id="viewer-close" aria-label="Close">close ×</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
